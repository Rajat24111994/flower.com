<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <script src="./safe-storage.js?v=1"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Xem lại những bó hoa bạn đã chọn và cập nhật số lượng trước khi thanh toán tại Flowerflow." />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="canonical" href="https://flower-com-six.vercel.app/cart.html" />
    <link rel="icon" type="image/png" href="./images/flowerflow-logo.png" />
    <title>Giỏ hàng</title>
    <link rel="stylesheet" href="./store-header.css?v=2" />
    <link rel="stylesheet" href="./cart.css?v=3" />
    <link rel="stylesheet" href="./store-footer.css?v=3" />
  <link rel="stylesheet" href="./contact-tools.css?v=2">
  </head>
  <body>
    <script src="./store-header.js?v=4"></script>

    <main class="nav">
      <div id="product-container"></div>

      <div class="checkout">
        <div class="checkout-heading">
          <span class="checkout-eyebrow">Flowerflow · Giỏ hàng</span>
          <h1>Tóm tắt đơn hàng</h1>
          <p>Kiểm tra chi phí trước khi bạn gửi yêu thương.</p>
        </div>
        <div class="details">
          <div class="summary-row">
            <div><p>Giá gốc</p></div>
            <div id="originalprice">0</div>
          </div>
          <div class="summary-row summary-row--savings">
            <div><p>Ưu đãi <small>(tự áp dụng mức giảm cao nhất ở bước thanh toán)</small></p></div>
            <div id="savings">0</div>
          </div>
          <div class="summary-row">
            <div><p>Phí giao hàng</p></div>
            <div id="deliveryCharge">Miễn phí</div>
          </div>
          <div class="summary-row summary-row--total">
            <div><p>Tổng tiền</p></div>
            <div id="total">0</div>
          </div>
        </div>
        <div id="check">
          <a class="checkout-continue" href="./checkout.html">Tiến hành thanh toán <span aria-hidden="true">→</span></a>
        </div>
      </div>
    </main>

    <script src="./store-footer.js?v=3"></script>
    <script src="./currency.js?v=10"></script>
    <script src="./product-names.js?v=2"></script>
    <script>
      let CartContainer = document.getElementById("product-container");
      let Cart = FlowerSafeStorage.readJson("cart", {
        fallback: [],
        validate: (value) => Array.isArray(value)
          && value.every((item) => item && typeof item === "object" && !Array.isArray(item) && item.id !== undefined)
      });

      function saveCart(nextCart) {
        try {
          FlowerSafeStorage.writeJson("cart", nextCart, { required: true });
          Cart = nextCart;
          DisplayProduct();
          return true;
        } catch (error) {
          console.error("Không thể lưu giỏ hàng:", error);
          alert("Chưa thể lưu thay đổi giỏ hàng. Hãy kiểm tra dung lượng hoặc quyền lưu trữ của trình duyệt rồi thử lại.");
          return false;
        }
      }

      function DisplayProduct() {
        const cartTotal = document.getElementById("cartTotal");
        cartTotal.textContent = Cart.length;
        document.querySelector(".nav").classList.toggle("is-empty", Cart.length === 0);

        CartContainer.innerHTML = "";

        Cart.forEach((product) => {
          let image = document.createElement("img");
          let details = document.createElement("p");
          let price = document.createElement("h3");
          let Remove = document.createElement("button");
          let Increase = document.createElement("button");
          let Decrease = document.createElement("button");
          let card = document.createElement("div");
          let quantity = document.createElement("span");
          let stockNote = document.createElement("p");

          image.src = product.image;
          image.alt = getVietnameseProductName(product.title || "Sản phẩm hoa");
          image.width = 480;
          image.height = 480;
          image.loading = "lazy";
          details.textContent = getVietnameseProductName(product.title);
          price.textContent = formatVnd(product.price);
          Remove.textContent = "Xóa";
          Increase.textContent = "+";
          Decrease.textContent = "-";
          const productQuantity = Math.max(1, Number(product.quantity) || 1);
          const stockQuantity = Number(product.stockQuantity);
          const hasStockLimit = Number.isFinite(stockQuantity) && stockQuantity >= 0;
          quantity.textContent = productQuantity;
          Increase.disabled = hasStockLimit && productQuantity >= stockQuantity;
          stockNote.textContent = hasStockLimit
            ? productQuantity > stockQuantity
              ? `Số lượng trong giỏ vượt tồn kho (${stockQuantity}).`
              : `Tồn kho: ${stockQuantity}`
            : "";

          Decrease.addEventListener("click", () => {
            if (productQuantity > 1) {
              saveCart(Cart.map((item) => item.id === product.id
                ? { ...item, quantity: productQuantity - 1 }
                : item));
            }
          });
          Increase.addEventListener("click", () => {
            if (hasStockLimit && productQuantity >= stockQuantity) return;
            saveCart(Cart.map((item) => item.id === product.id
              ? { ...item, quantity: productQuantity + 1 }
              : item));
          });
          Remove.addEventListener("click", () => {
            const nextCart = Cart.filter((ele) => ele.id !== product.id);
            if (saveCart(nextCart)) {
              Swal.fire({
                position: "center",
                icon: "success",
                title: "Đã xóa sản phẩm khỏi giỏ hàng",
                showConfirmButton: false,
                timer: 1500
              });
            }
          });
          card.append(
            image,
            price,
            details,
            stockNote,
            Increase,
            quantity,
            Decrease,
            Remove
          );
          CartContainer.append(card);
        });

        renderCartSummary(Cart);
      }

      DisplayProduct();

      // The stock saved with each cart line is from when it was added; read the shop's current
      // stock so the page does not offer quantities that are no longer available.
      fetch("/api/products", { headers: { Accept: "application/json" } })
        .then((response) => response.ok ? response.json() : Promise.reject(new Error(String(response.status))))
        .then(({ products }) => {
          if (!Array.isArray(products) || !products.length) return;
          const stockById = new Map(products.map((product) => [String(product.id), Number(product.quantity)]));
          let changed = false;
          const nextCart = Cart.map((item) => {
            const stock = stockById.has(String(item.id)) ? stockById.get(String(item.id)) : 0;
            if (!Number.isInteger(stock) || stock === Number(item.stockQuantity)) return item;
            changed = true;
            return { ...item, stockQuantity: Math.max(0, stock) };
          });
          if (changed) saveCart(nextCart);
        })
        .catch((error) => console.warn("Không thể cập nhật tồn kho mới nhất:", error));
    </script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="./contact-tools.js?v=1"></script>
  </body>
</html>
