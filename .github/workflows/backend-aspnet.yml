name: ASP.NET backend
on:
  pull_request:
    paths: ['backend/**', 'flower.com/**', 'tests/**', '.github/workflows/backend-aspnet.yml']
  push:
    paths: ['backend/**', 'flower.com/**', 'tests/**', '.github/workflows/backend-aspnet.yml']
permissions:
  contents: read
jobs:
  contracts-and-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --prefix flower.com
      - run: npm ci --prefix tests
      - run: dotnet restore backend/Flower.Api/Flower.Api.csproj --locked-mode
      - run: dotnet build backend/Flower.ContractTests/Flower.ContractTests.csproj
      - run: node backend/test-contracts.cjs
      - run: node flower.com/node_modules/firebase-tools/lib/bin/firebase.js emulators:exec --only auth,firestore --project demo-flowerflow --config flower.com/firebase.json "node backend/test-api.cjs"
      - run: dotnet publish backend/Flower.Api/Flower.Api.csproj --no-restore -c Release -o backend/publish
      - run: node backend/test-publish.cjs
