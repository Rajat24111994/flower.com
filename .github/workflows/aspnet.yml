name: ASP.NET build

on:
  push:
    branches: [main, asp.net]
    paths:
      - 'aspnet/**'
      - '.github/workflows/aspnet.yml'
  pull_request:
    paths:
      - 'aspnet/**'
      - '.github/workflows/aspnet.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: dotnet build aspnet/FlowerFlow.sln --configuration Release
      - run: dotnet run --project aspnet/tests/FlowerFlow.Contracts --configuration Release --no-build
