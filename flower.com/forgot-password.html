<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f5f3ec">
    <title>Khôi phục tài khoản | Flowerflow</title>
    <link rel="stylesheet" href="./forgot-password.css">
    <link rel="stylesheet" href="./store-footer.css?v=2">
</head>

<body>
    <main class="recovery-shell">
        <a class="brand" href="./index.html" aria-label="Về trang chủ Flowerflow">
            <span class="brand-mark" aria-hidden="true">✿</span>
            <span>flowerflow</span>
        </a>
        <section class="recovery-card" aria-labelledby="recovery-title">
            <a class="back-link" href="./login.html">← Quay lại đăng nhập</a>
            <div class="recovery-icon" aria-hidden="true">✿</div>
            <p class="eyebrow">KHÔI PHỤC TÀI KHOẢN</p>
            <h1 id="recovery-title">Đặt lại mật khẩu</h1>
            <p class="intro" id="recovery-intro">Nhập email đã dùng khi đăng ký. Chúng tôi sẽ gửi hướng dẫn hoặc liên kết đặt lại mật khẩu cho bạn.</p>
            <form id="recovery-form">
                <label for="recovery-email">Email</label>
                <input type="email" id="recovery-email" placeholder="Nhập địa chỉ email của bạn" autocomplete="email" required>
                <div id="local-password-fields" hidden>
                    <label for="new-password">Mật khẩu mới</label>
                    <input type="password" id="new-password" placeholder="Ít nhất 6 ký tự" autocomplete="new-password" minlength="6">
                    <label for="confirm-password">Xác nhận mật khẩu mới</label>
                    <input type="password" id="confirm-password" placeholder="Nhập lại mật khẩu mới" autocomplete="new-password" minlength="6">
                </div>
                <p class="message" id="recovery-message" role="status" aria-live="polite"></p>
                <button class="submit" id="recovery-submit" type="submit">Gửi liên kết</button>
            </form>
        </section>
    </main>
    <script type="module" src="./forgot-password.js"></script>
    <script src="./store-footer.js?v=2"></script>
</body>

</html>
