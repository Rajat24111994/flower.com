<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <script src="./js/core/safe-storage.js?v=2"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <meta name="description" content="Đặt lại mật khẩu để khôi phục quyền truy cập tài khoản Flowerflow.">
    <link rel="icon" type="image/svg+xml" href="./favicon.svg">
    <meta name="theme-color" content="#f5f3ec">
    <title>Khôi phục tài khoản | Flowerflow</title>
    <link rel="stylesheet" href="./css/account/forgot-password.css?v=1">
    <link rel="stylesheet" href="./css/core/accessibility.css?v=1">
    <link rel="stylesheet" href="./css/core/store-footer.css?v=3">
<link rel="stylesheet" href="./css/core/contact-tools.css?v=3">
</head>

<body>
    <main class="recovery-shell">
        <a class="brand" href="./index.html" aria-label="Về trang chủ Flowerflow">
            <span class="brand-mark" aria-hidden="true">✿</span>
            <span>flowerflow</span>
        </a>
        <section class="recovery-card" aria-labelledby="recovery-title">
            <a class="back-link" href="./login.html">← Quay lại đăng nhập</a>
            <div class="recovery-icon" aria-hidden="true">✿</div>
            <p class="eyebrow">KHÔI PHỤC TÀI KHOẢN</p>
            <h1 id="recovery-title">Đặt lại mật khẩu</h1>
            <p class="intro" id="recovery-intro">Nhập địa chỉ thư điện tử đã dùng khi đăng ký để nhận liên kết đặt lại mật khẩu.</p>
            <form id="recovery-form">
                <label for="recovery-email">Địa chỉ thư điện tử</label>
                <input type="email" id="recovery-email" placeholder="Nhập địa chỉ thư điện tử của bạn" autocomplete="email" required>
                <p class="message" id="recovery-message" role="status" aria-live="polite"></p>
                <button class="submit" id="recovery-submit" type="submit">Gửi liên kết</button>
            </form>
        </section>
    </main>
    <script type="module" src="./js/account/forgot-password.js?v=1"></script>
    <script src="./js/core/store-footer.js?v=4"></script>
<script src="./js/core/contact-tools.js?v=1"></script>
</body>

</html>
